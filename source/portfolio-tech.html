function useReveal(threshold = 0.12) {
  const ref = useRef();
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add('visible'); obs.disconnect(); }
    }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

                { period: '2022–Present', role: 'Product Designer', where: 'SaaS & AI Platforms' },

function TweaksPanel({ tweaks, setTweaks }) {
  return (
    <div id="tweaks-panel">
      <h3>// tweaks</h3>
      <div className="tweak-row">
        <label>Accent Color</label>
        <select value={tweaks.accentColor} onChange={e => {
          const v = e.target.value;
          setTweaks(t => ({...t, accentColor: v}));
          document.documentElement.style.setProperty('--cyan', ACCENT_OPTIONS[v]);
          document.documentElement.style.setProperty('--cyan-dim', ACCENT_OPTIONS[v] + '20');
        }}>
          <option value="cyan">Cyan</option>
          <option value="green">Terminal Green</option>
          <option value="violet">Violet</option>
        </select>
      </div>
    </div>
  );
}

function App() {
  const [scrolled, setScrolled] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel')?.classList.add('visible');
      else if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel')?.classList.remove('visible');
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <Nav scrolled={scrolled} />
      <Hero />
      <WorkSection />
      <AboutSection />
      <ContactSection />
      <Footer />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
