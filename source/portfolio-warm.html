// Intersection observer hook
function useReveal(threshold = 0.15) {
  const ref = useRef();
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { el.classList.add('visible'); obs.disconnect(); }
    }, { threshold });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

        onMouseEnter={e => { e.currentTarget.style.background = 'var(--terra-light)'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
        onMouseLeave={e => { e.currentTarget.style.background = 'var(--terra)'; e.currentTarget.style.transform = 'translateY(0)'; }}
        >
          Say hello →
        </a>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer style={{
      padding: '24px 48px',
      borderTop: '1px solid var(--sand)',
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    }}>
      <span style={{ fontFamily: 'var(--font-display)', fontSize: 16, color: 'var(--ink-muted)' }}>Preksha Mysore</span>
      <span style={{ fontSize: 12, color: 'var(--ink-muted)', letterSpacing: '0.06em' }}>© 2025 · UX Designer</span>
      <div style={{ display: 'flex', gap: 24 }}>
        {['LinkedIn', 'Dribbble', 'Resume'].map(l => (
          <a key={l} href="#" style={{
            fontSize: 12, letterSpacing: '0.08em', textTransform: 'uppercase',
            color: 'var(--ink-muted)', textDecoration: 'none',
            transition: 'color 0.2s',
          }}
          onMouseEnter={e => e.target.style.color = 'var(--terra)'}
          onMouseLeave={e => e.target.style.color = 'var(--ink-muted)'}
          >{l}</a>
        ))}
      </div>
    </footer>
  );
}

function TweaksPanel({ tweaks, setTweaks }) {
  return (
    <div id="tweaks-panel">
      <h3>Tweaks</h3>
      <div className="tweak-row">
        <label>Accent Color</label>
        <select value={tweaks.accentColor} onChange={e => setTweaks(t => ({...t, accentColor: e.target.value}))}>
          <option value="terracotta">Terracotta</option>
          <option value="sage">Sage Green</option>
          <option value="dustyRose">Dusty Rose</option>
        </select>
      </div>
      <div className="tweak-row">
        <label>Type Scale</label>
        <select value={tweaks.typeScale} onChange={e => setTweaks(t => ({...t, typeScale: e.target.value}))}>
          <option value="editorial">Editorial (large)</option>
          <option value="compact">Compact</option>
        </select>
      </div>
    </div>
  );
}

function App() {
  const [scrolled, setScrolled] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // Apply accent color
  useEffect(() => {
    const colors = ACCENT_COLORS[tweaks.accentColor] || ACCENT_COLORS.terracotta;
    document.documentElement.style.setProperty('--terra', colors.terra);
    document.documentElement.style.setProperty('--terra-light', colors.terraLight);
    document.documentElement.style.setProperty('--terra-pale', colors.terraPale);
  }, [tweaks.accentColor]);

  // Tweaks message listener
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') {
        document.getElementById('tweaks-panel')?.classList.add('visible');
      } else if (e.data?.type === '__deactivate_edit_mode') {
        document.getElementById('tweaks-panel')?.classList.remove('visible');
      }
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <Nav scrolled={scrolled} />
      <Hero />
      <WorkSection />
      <AboutSection />
      <ContactSection />
      <Footer />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
